<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ระบบบริหารจัดการคลินิกและสถานพยาบาลบน Cloud — EHP CIS"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>EHP CIS · ระบบสารสนเทศคลินิกและสถานพยาบาล</title>
  </head>
  <body>
    <div id="root"></div>

    <!-- Liquid-glass refraction filter — displaces the backdrop like real glass.
         Consumed by .liquid-glass via backdrop-filter: url(#liquid-glass). -->
    <svg
      aria-hidden="true"
      style="position: absolute; width: 0; height: 0; pointer-events: none"
    >
      <filter
        id="liquid-glass"
        x="-35%"
        y="-35%"
        width="170%"
        height="170%"
        color-interpolation-filters="sRGB"
      >
        <feTurbulence
          type="fractalNoise"
          baseFrequency="0.009 0.011"
          numOctaves="2"
          seed="7"
          result="noise"
        />
        <feGaussianBlur in="noise" stdDeviation="2.4" result="smooth" />
        <feDisplacementMap
          in="SourceGraphic"
          in2="smooth"
          scale="26"
          xChannelSelector="R"
          yChannelSelector="G"
        />
      </filter>

      <!-- stronger variant — pronounced refraction for glass buttons -->
      <filter
        id="liquid-glass-strong"
        x="-60%"
        y="-60%"
        width="220%"
        height="220%"
        color-interpolation-filters="sRGB"
      >
        <feTurbulence
          type="fractalNoise"
          baseFrequency="0.006 0.008"
          numOctaves="2"
          seed="11"
          result="noise"
        />
        <feGaussianBlur in="noise" stdDeviation="3" result="smooth" />
        <feDisplacementMap
          in="SourceGraphic"
          in2="smooth"
          scale="66"
          xChannelSelector="R"
          yChannelSelector="G"
        />
      </filter>
    </svg>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
